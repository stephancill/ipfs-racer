name = "ipfs-racer"
main = "src/index.ts"
compatibility_date = "2026-04-26"
workers_dev = false

routes = [{ pattern = "ipfs.stupidtech.net", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "METRICS_DO"
class_name = "MetricsDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsDurableObject"]
